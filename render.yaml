services:
  - type: web
    name: nagarclean
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_ZONE_EMAIL
        sync: false
      - key: DEMO_ZONE_PASSWORD
        sync: false
      - key: DEMO_ZONE2_EMAIL
        sync: false
      - key: DEMO_ZONE2_PASSWORD
        sync: false
      - key: DEMO_ZONE3_EMAIL
        sync: false
      - key: DEMO_ZONE3_PASSWORD
        sync: false
      - key: DEMO_ZONE4_EMAIL
        sync: false
      - key: DEMO_ZONE4_PASSWORD
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
